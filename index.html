<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<title>M7 Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
/* ------------------------------------------------------------------
   Design tokens
------------------------------------------------------------------ */
:root{
  --bg:#05060a;
  --panel:rgba(16,18,26,.82);
  --panel-solid:#101219;
  --border:rgba(255,255,255,.075);
  --border-strong:rgba(255,255,255,.14);
  --text:#e9edf6;
  --text-dim:#98a2b8;
  --text-faint:#5f6880;

  --up:#1fe07f;
  --down:#ff4f63;
  --flat:#ffc531;

  --radius:20px;
  --radius-sm:12px;
  --gap:18px;
}

*,*::before,*::after{box-sizing:border-box;}

html{-webkit-text-size-adjust:100%;}

body{
  margin:0;
  min-height:100vh;
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  color:var(--text);
  background:var(--bg);
  background-image:
    radial-gradient(900px 520px at 12% -8%, rgba(31,224,127,.10), transparent 62%),
    radial-gradient(820px 500px at 88% 0%, rgba(96,132,255,.13), transparent 60%),
    radial-gradient(700px 700px at 50% 118%, rgba(255,79,99,.08), transparent 65%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

body::before{
  content:'';
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
  background-image:linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);
  background-size:56px 56px;
  mask-image:radial-gradient(circle at 50% 22%,#000 0%,transparent 78%);
  -webkit-mask-image:radial-gradient(circle at 50% 22%,#000 0%,transparent 78%);
}

.app{position:relative;z-index:1;max-width:1560px;margin:0 auto;padding:30px 22px 70px;}

/* ------------------------------------------------------------------
   Header
------------------------------------------------------------------ */
.masthead{
  display:flex;
  flex-wrap:wrap;
  align-items:flex-end;
  justify-content:space-between;
  gap:20px;
  padding-bottom:22px;
  margin-bottom:26px;
  border-bottom:1px solid var(--border);
}

.brand{display:flex;align-items:center;gap:14px;min-width:0;}

.brand-mark{
  width:46px;height:46px;flex:none;
  border-radius:14px;
  display:grid;place-items:center;
  background:linear-gradient(145deg,#1b2030,#0c0e15);
  border:1px solid var(--border-strong);
  box-shadow:0 0 26px -10px rgba(96,132,255,.85), inset 0 1px 0 rgba(255,255,255,.07);
  font-weight:800;font-size:17px;letter-spacing:-.5px;
  background-clip:padding-box;
}
.brand-mark span{
  background:linear-gradient(140deg,#8fb4ff,#1fe07f);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}

.brand-copy{min-width:0;}
.brand h1{
  margin:0;
  font-size:clamp(19px,2.3vw,26px);
  font-weight:800;
  letter-spacing:-.6px;
  line-height:1.15;
}
.brand p{
  margin:4px 0 0;
  font-size:12.5px;
  color:var(--text-dim);
  letter-spacing:.02em;
}

.status-cluster{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}

.status{
  display:inline-flex;align-items:center;gap:9px;
  padding:9px 15px;
  border-radius:999px;
  background:rgba(255,255,255,.035);
  border:1px solid var(--border);
  font-size:12.5px;
  color:var(--text-dim);
  white-space:nowrap;
}
.dot{
  width:7px;height:7px;border-radius:50%;
  background:var(--up);
  box-shadow:0 0 0 0 rgba(31,224,127,.6);
  animation:pulse 2.2s infinite;
  flex:none;
}
.dot.loading{background:var(--flat);animation-duration:1s;}
.dot.error{background:var(--down);animation:none;box-shadow:0 0 10px rgba(255,79,99,.9);}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(31,224,127,.55);}
  70%{box-shadow:0 0 0 9px rgba(31,224,127,0);}
  100%{box-shadow:0 0 0 0 rgba(31,224,127,0);}
}

.btn{
  appearance:none;
  display:inline-flex;align-items:center;gap:8px;
  padding:10px 17px;
  border-radius:11px;
  border:1px solid var(--border-strong);
  background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
  color:var(--text);
  font:inherit;font-size:13px;font-weight:600;
  cursor:pointer;
  transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease,opacity .16s ease;
}
.btn:hover{border-color:rgba(143,180,255,.55);box-shadow:0 0 22px -8px rgba(143,180,255,.9);}
.btn:active{transform:scale(.97);}
.btn[disabled]{opacity:.5;cursor:not-allowed;}
.btn svg{width:15px;height:15px;}
.btn.busy svg{animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ------------------------------------------------------------------
   Grid
------------------------------------------------------------------ */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(370px,1fr));
  gap:var(--gap);
  align-items:start;
}

/* ------------------------------------------------------------------
   Card
------------------------------------------------------------------ */
.card{
  position:relative;
  border-radius:var(--radius);
  padding:20px;
  background:var(--panel);
  border:1px solid var(--border);
  backdrop-filter:blur(16px) saturate(140%);
  -webkit-backdrop-filter:blur(16px) saturate(140%);
  transition:box-shadow .55s ease,border-color .55s ease,transform .28s ease;
  box-shadow:0 18px 44px -30px rgba(0,0,0,.95);
  overflow:hidden;
}
.card::after{
  content:'';
  position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.05),transparent 34%);
}
.card:hover{transform:translateY(-3px);}

/* Glow colour is driven by the trend class (same colour as the price arrow) */
.card.trend-up{
  border-color:rgba(31,224,127,.38);
  box-shadow:
    0 0 0 1px rgba(31,224,127,.16),
    0 0 26px -6px rgba(31,224,127,.50),
    0 0 78px -26px rgba(31,224,127,.72),
    0 18px 44px -30px rgba(0,0,0,.95);
}
.card.trend-down{
  border-color:rgba(255,79,99,.38);
  box-shadow:
    0 0 0 1px rgba(255,79,99,.16),
    0 0 26px -6px rgba(255,79,99,.50),
    0 0 78px -26px rgba(255,79,99,.72),
    0 18px 44px -30px rgba(0,0,0,.95);
}
.card.trend-flat{
  border-color:rgba(255,197,49,.38);
  box-shadow:
    0 0 0 1px rgba(255,197,49,.16),
    0 0 26px -6px rgba(255,197,49,.48),
    0 0 78px -26px rgba(255,197,49,.68),
    0 18px 44px -30px rgba(0,0,0,.95);
}

/* ---- card head ---- */
.card-head{display:flex;align-items:center;gap:13px;margin-bottom:16px;position:relative;z-index:1;}

.logo-wrap{
  position:relative;
  width:46px;height:46px;flex:none;
  border-radius:13px;
  background:#fff;
  display:grid;place-items:center;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.14);
}
.logo-wrap img{width:100%;height:100%;object-fit:contain;padding:5px;display:block;}
.logo-fallback{
  position:absolute;inset:0;display:none;place-items:center;
  font-weight:800;font-size:17px;color:#0b0d13;
  background:linear-gradient(140deg,#dfe6f6,#9fb0d0);
}
.logo-wrap.failed img{display:none;}
.logo-wrap.failed .logo-fallback{display:grid;}

.ident{min-width:0;flex:1;}
.ident .name{
  margin:0;
  font-size:15.5px;font-weight:700;letter-spacing:-.25px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.ident .symbol{
  display:block;margin-top:3px;
  font-size:11.5px;font-weight:600;letter-spacing:.09em;
  color:var(--text-faint);text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

/* ---- price block ---- */
.price-block{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  position:relative;z-index:1;
}
.price-col{min-width:0;}
.price{
  font-size:clamp(28px,3.4vw,35px);
  font-weight:800;
  letter-spacing:-1.4px;
  line-height:1.05;
  font-variant-numeric:tabular-nums;
  display:block;
}
.change-chip{
  display:inline-flex;align-items:center;gap:6px;
  margin-top:8px;
  padding:4px 10px;
  border-radius:8px;
  font-size:12px;font-weight:700;
  font-variant-numeric:tabular-nums;
  letter-spacing:.01em;
  background:rgba(255,255,255,.06);
  color:var(--text-dim);
}
.trend-up .change-chip{background:rgba(31,224,127,.13);color:var(--up);}
.trend-down .change-chip{background:rgba(255,79,99,.13);color:var(--down);}
.trend-flat .change-chip{background:rgba(255,197,49,.13);color:var(--flat);}
.change-chip .vs{color:var(--text-faint);font-weight:600;}

/* ---- arrows ---- */
.arrow{width:52px;height:52px;flex:none;display:grid;place-items:center;}
.arrow svg{width:100%;height:100%;display:block;transition:filter .4s ease;}
.trend-up .arrow svg{color:var(--up);filter:drop-shadow(0 0 12px rgba(31,224,127,.85));animation:rise 2.6s ease-in-out infinite;}
.trend-down .arrow svg{color:var(--down);filter:drop-shadow(0 0 12px rgba(255,79,99,.85));animation:fall 2.6s ease-in-out infinite;}
.trend-flat .arrow svg{color:var(--flat);filter:drop-shadow(0 0 12px rgba(255,197,49,.8));animation:breathe 2.6s ease-in-out infinite;}
@keyframes rise{0%,100%{transform:translateY(2px);}50%{transform:translateY(-5px);}}
@keyframes fall{0%,100%{transform:translateY(-2px);}50%{transform:translateY(5px);}}
@keyframes breathe{0%,100%{transform:scale(.94);}50%{transform:scale(1.06);}}

/* ---- meta stats ---- */
.meta{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:16px;
  padding-top:14px;
  border-top:1px solid var(--border);
  position:relative;z-index:1;
}
.meta-item{min-width:0;}
.meta-item .k{
  display:block;
  font-size:10px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;
  color:var(--text-faint);
}
.meta-item .v{
  display:block;margin-top:4px;
  font-size:13.5px;font-weight:700;
  font-variant-numeric:tabular-nums;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.meta-item .v.hi{color:var(--text);}

/* ---- section shell ---- */
.section{margin-top:18px;padding-top:16px;border-top:1px solid var(--border);position:relative;z-index:1;}
.section-title{
  display:flex;align-items:center;gap:8px;
  margin:0 0 12px;
  font-size:10.5px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;
  color:var(--text-faint);
}
.section-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent);}

/* ---- consensus (stacked vertically) ---- */
.bars{display:flex;flex-direction:column;gap:9px;}
.bar-row{
  display:grid;
  grid-template-columns:46px 1fr 42px;
  align-items:center;
  gap:11px;
}
.bar-label{font-size:12px;font-weight:700;letter-spacing:.02em;color:var(--text-dim);}
.bar-track{
  height:9px;border-radius:99px;
  background:rgba(255,255,255,.06);
  overflow:hidden;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.55);
}
.bar-fill{
  height:100%;border-radius:99px;
  width:0;
  transition:width .9s cubic-bezier(.22,1,.36,1);
}
.bar-fill.buy{background:linear-gradient(90deg,#0fae62,#2affa0);box-shadow:0 0 12px rgba(31,224,127,.75);}
.bar-fill.hold{background:linear-gradient(90deg,#c99313,#ffd970);box-shadow:0 0 12px rgba(255,197,49,.7);}
.bar-fill.sell{background:linear-gradient(90deg,#c8303f,#ff7181);box-shadow:0 0 12px rgba(255,79,99,.75);}
.bar-pct{
  font-size:12px;font-weight:800;text-align:right;
  font-variant-numeric:tabular-nums;
}
.bar-row.buy .bar-pct{color:var(--up);}
.bar-row.hold .bar-pct{color:var(--flat);}
.bar-row.sell .bar-pct{color:var(--down);}
.consensus-note{
  margin:11px 0 0;
  font-size:11px;color:var(--text-faint);
  letter-spacing:.02em;
}

/* ---- news ---- */
.news-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;}
.news-item a{
  display:flex;gap:11px;align-items:flex-start;
  padding:9px 10px;
  margin:0 -10px;
  border-radius:var(--radius-sm);
  text-decoration:none;
  color:inherit;
  transition:background .18s ease,transform .18s ease;
}
.news-item a:hover{background:rgba(255,255,255,.055);transform:translateX(2px);}
.news-thumb{
  width:52px;height:52px;flex:none;
  border-radius:9px;object-fit:cover;
  background:rgba(255,255,255,.05);
  border:1px solid var(--border);
}
.news-thumb[hidden]{display:none;}
.news-body{min-width:0;flex:1;}
.news-headline{
  margin:0;
  font-size:13px;font-weight:600;line-height:1.38;
  color:#cfd7e8;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  transition:color .18s ease;
}
.news-item a:hover .news-headline{color:#fff;}
.news-meta{
  display:block;margin-top:5px;
  font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  color:var(--text-faint);
}
.news-meta b{color:#7f8aa3;font-weight:700;}

/* ---- states ---- */
.placeholder{
  font-size:12.5px;color:var(--text-faint);
  padding:14px 0;text-align:center;letter-spacing:.02em;
}
.skeleton{
  border-radius:8px;
  background:linear-gradient(100deg,rgba(255,255,255,.05) 20%,rgba(255,255,255,.12) 50%,rgba(255,255,255,.05) 80%);
  background-size:220% 100%;
  animation:shimmer 1.35s linear infinite;
  color:transparent!important;
}
@keyframes shimmer{0%{background-position:150% 0;}100%{background-position:-50% 0;}}

.card.errored{opacity:.62;}
.alert{
  margin-top:16px;
  padding:13px 15px;
  border-radius:var(--radius-sm);
  border:1px solid rgba(255,79,99,.4);
  background:rgba(255,79,99,.09);
  color:#ffc3ca;
  font-size:12.5px;line-height:1.5;
}
.alert code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:#fff;}

footer{
  margin-top:42px;padding-top:20px;
  border-top:1px solid var(--border);
  display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;
  font-size:11.5px;color:var(--text-faint);
}

/* ------------------------------------------------------------------
   Responsive
------------------------------------------------------------------ */
@media (max-width:1180px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(330px,1fr));}
}
@media (max-width:820px){
  .app{padding:22px 15px 56px;}
  .grid{grid-template-columns:1fr;}
  .masthead{gap:16px;}
}
@media (max-width:430px){
  .card{padding:16px;border-radius:17px;}
  .logo-wrap{width:40px;height:40px;border-radius:11px;}
  .arrow{width:44px;height:44px;}
  .meta{grid-template-columns:repeat(2,1fr);gap:11px;}
  .meta-item.range{grid-column:1 / -1;}
  .status{padding:7px 12px;font-size:11.5px;}
  .btn{padding:9px 14px;font-size:12.5px;}
  .bar-row{grid-template-columns:42px 1fr 38px;gap:9px;}
  .news-thumb{width:46px;height:46px;}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;}
}
</style>
</head>
<body>
<div class="app">

  <header class="masthead">
    <div class="brand">
      <div class="brand-mark"><span>M7</span></div>
      <div class="brand-copy">
        <h1>M7 Live</h1>
        <p>Real-time quotes, analyst consensus &amp; headlines — powered by Finnhub</p>
      </div>
    </div>
    <div class="status-cluster">
      <span class="status" id="status"><i class="dot loading" id="statusDot"></i><span id="statusText">Connecting…</span></span>
      <button class="btn" id="refreshBtn" type="button" title="Refresh prices">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-3.2-6.9"/><path d="M21 3v6h-6"/>
        </svg>
        Refresh
      </button>
    </div>
  </header>

  <main class="grid" id="grid"></main>

  <footer>
    <span>Data © Finnhub · Quotes may be delayed 15 min on the free tier.</span>
    <span>Prices auto-refresh every 60s · Not investment advice.</span>
  </footer>

</div>

<script>
(() => {
  'use strict';

  /* ================================================================
     Configuration
  ================================================================ */
  const API_BASE = 'https://finnhub.io/api/v1';

  // The API key is deliberately NOT hard-coded here. It is read at runtime
  // from the FINNHUB_API_KEY entry of the sibling `.env` file (fetched over
  // REST), so the secret stays out of source control. `window.__ENV` can be
  // used instead to inject it without touching this file.
  let KEYS = [];
  let keyIndex = 0;

  const CONCURRENCY = 4;         // parallel requests during initial load
  const AUTO_REFRESH_MS = 60000; // quote-only refresh cadence
  const NEWS_DAYS = 30;          // look-back window for headlines
  const NEWS_COUNT = 5;

  const STOCKS = [
    { symbol:'AAPL',  name:'Apple Inc.',           exchange:'NASDAQ' },
    { symbol:'MSFT',  name:'Microsoft Corporation', exchange:'NASDAQ' },
    { symbol:'GOOGL', name:'Alphabet Inc.',         exchange:'NASDAQ' },
    { symbol:'AMZN',  name:'Amazon.com, Inc.',      exchange:'NASDAQ' },
    { symbol:'NVDA',  name:'NVIDIA Corporation',    exchange:'NASDAQ' },
    { symbol:'META',  name:'Meta Platforms, Inc.',  exchange:'NASDAQ' },
    { symbol:'TSLA',  name:'Tesla, Inc.',           exchange:'NASDAQ' }
  ];

  /* ================================================================
     Tiny helpers
  ================================================================ */
  const $ = (sel) => document.querySelector(sel);
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  const money = (n) =>
    Number.isFinite(n)
      ? n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
      : '—';

  const signed = (n) => (n > 0 ? '+' : '') + n.toFixed(2);

  function timeAgo(unixSeconds) {
    const secs = Math.max(1, Math.floor(Date.now() / 1000 - unixSeconds));
    const units = [
      [31536000, 'y'], [2592000, 'mo'], [604800, 'w'],
      [86400, 'd'], [3600, 'h'], [60, 'm']
    ];
    for (const [size, label] of units) {
      if (secs >= size) return `${Math.floor(secs / size)}${label} ago`;
    }
    return `${secs}s ago`;
  }

  const escapeHtml = (str) =>
    String(str ?? '').replace(/[&<>"']/g, (c) =>
      ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

  function setText(el, value) {
    if (el) el.textContent = value;
  }

  /* ================================================================
     Runtime secrets (.env)
  ================================================================ */
  /** Minimal .env parser — supports comments, blank lines and quoting. */
  function parseEnv(text) {
    const env = {};
    for (const rawLine of text.split(/\r?\n/)) {
      const line = rawLine.trim();
      if (!line || line.startsWith('#')) continue;
      const eq = line.indexOf('=');
      if (eq === -1) continue;
      const name = line.slice(0, eq).trim();
      let value = line.slice(eq + 1).trim();
      value = /^(["']).*\1$/.test(value)
        ? value.slice(1, -1)
        : value.split(/\s+#/)[0].trim();
      if (name) env[name] = value;
    }
    return env;
  }

  /** Resolves the Finnhub API key from window.__ENV or the .env file. */
  async function resolveApiKey() {
    if (window.__ENV && window.__ENV.FINNHUB_API_KEY) {
      return String(window.__ENV.FINNHUB_API_KEY).trim();
    }
    try {
      const res = await fetch('.env', { cache: 'no-store' });
      if (res.ok) {
        const env = parseEnv(await res.text());
        if (env.FINNHUB_API_KEY) return env.FINNHUB_API_KEY;
      }
    } catch (err) {
      console.warn('[env] .env could not be loaded:', err.message);
    }
    return null;
  }

  /* ================================================================
     REST layer
  ================================================================ */
  async function api(path, params = {}, attempt = 0) {
    const url = new URL(API_BASE + path);
    for (const [k, v] of Object.entries(params)) url.searchParams.set(k, v);
    url.searchParams.set('token', KEYS[keyIndex]);

    let res;
    try {
      res = await fetch(url.toString(), { headers: { Accept: 'application/json' } });
    } catch (err) {
      if (attempt < 2) { await sleep(800 * (attempt + 1)); return api(path, params, attempt + 1); }
      throw new Error('Network request failed');
    }

    if (res.status === 401 || res.status === 403) {
      if (keyIndex < KEYS.length - 1) { keyIndex += 1; return api(path, params, attempt); }
      throw new Error('API key rejected (401/403)');
    }
    if (res.status === 429) {
      if (attempt < 3) { await sleep(1600 * (attempt + 1)); return api(path, params, attempt + 1); }
      throw new Error('Rate limit reached — retry shortly');
    }
    if (!res.ok) {
      if (attempt < 2) { await sleep(700 * (attempt + 1)); return api(path, params, attempt + 1); }
      throw new Error(`HTTP ${res.status}`);
    }
    return res.json();
  }

  /** Runs `worker` over `items` with a bounded number of in-flight tasks. */
  async function pool(items, worker, concurrency) {
    const results = new Array(items.length);
    let cursor = 0;
    const runners = Array.from({ length: Math.min(concurrency, items.length) }, async () => {
      while (cursor < items.length) {
        const index = cursor++;
        results[index] = await worker(items[index], index);
      }
    });
    await Promise.all(runners);
    return results;
  }

  /* ================================================================
     Arrow markup (up / down / flat double-headed)
  ================================================================ */
  const ARROWS = {
    up: `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
           <path d="M12 2.6 20.4 12.6h-4.9v5.2H8.5v-5.2H3.6z"/>
         </svg>`,
    down: `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
             <path d="M12 21.4 3.6 11.4h4.9V6.2h7v5.2h4.9z"/>
           </svg>`,
    flat: `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
             <path d="M12 1.8 18.6 9h-3.9v6h3.9L12 22.2 5.4 15h3.9V9H5.4z"/>
           </svg>`
  };

  const trendOf = (current, reference) => {
    if (!Number.isFinite(current) || !Number.isFinite(reference)) return 'flat';
    if (current > reference) return 'up';
    if (current < reference) return 'down';
    return 'flat';
  };

  /* ================================================================
     Card construction
  ================================================================ */
  const cards = new Map(); // symbol -> { root, refs }

  function buildCard(stock) {
    const root = document.createElement('article');
    root.className = 'card';
    root.dataset.symbol = stock.symbol;
    root.innerHTML = `
      <div class="card-head">
        <div class="logo-wrap failed">
          <span class="logo-fallback">${escapeHtml(stock.symbol.slice(0, 1))}</span>
        </div>
        <div class="ident">
          <h2 class="name">${escapeHtml(stock.name)}</h2>
          <span class="symbol">${escapeHtml(stock.symbol)} · ${escapeHtml(stock.exchange)}</span>
        </div>
      </div>

      <div class="price-block">
        <div class="price-col">
          <span class="price skeleton" data-ref="price">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>
          <span class="change-chip" data-ref="chip">Loading…</span>
        </div>
        <div class="arrow" data-ref="arrow">${ARROWS.flat}</div>
      </div>

      <div class="meta">
        <div class="meta-item">
          <span class="k">Open</span>
          <span class="v hi" data-ref="open">—</span>
        </div>
        <div class="meta-item">
          <span class="k">Prev Close</span>
          <span class="v" data-ref="prev">—</span>
        </div>
        <div class="meta-item range">
          <span class="k">Day Range</span>
          <span class="v" data-ref="range">—</span>
        </div>
      </div>

      <section class="section">
        <h3 class="section-title">Analyst Consensus</h3>
        <div class="bars" data-ref="bars">
          <div class="placeholder">Loading analyst ratings…</div>
        </div>
        <p class="consensus-note" data-ref="consensusNote"></p>
      </section>

      <section class="section">
        <h3 class="section-title">Latest News</h3>
        <ul class="news-list" data-ref="news">
          <li class="placeholder">Loading headlines…</li>
        </ul>
      </section>
    `;

    // Logo fallback for a broken image URL: the letter tile shows until the
    // profile endpoint supplies a working logo.
    const refs = {};
    root.querySelectorAll('[data-ref]').forEach((el) => { refs[el.dataset.ref] = el; });

    $('#grid').appendChild(root);
    cards.set(stock.symbol, { root, refs });
  }

  /* ================================================================
     Per-stock data loaders
  ================================================================ */
  async function loadProfile(stock) {
    const { refs } = cards.get(stock.symbol);
    try {
      const profile = await api('/stock/profile2', { symbol: stock.symbol });
      if (profile && profile.name) {
        setText(refs.root.querySelector('.ident .name'), profile.name);
      }
      if (profile && profile.exchange) {
        setText(refs.root.querySelector('.ident .symbol'),
          `${stock.symbol} · ${profile.exchange.split(' - ')[0]}`);
      }
      if (profile && profile.logo) {
        const wrap = refs.root.querySelector('.logo-wrap');
        if (!wrap.querySelector('img')) {
          const img = document.createElement('img');
          img.alt = `${stock.name} logo`;
          img.loading = 'lazy';
          img.addEventListener('load', () => wrap.classList.remove('failed'));
          img.addEventListener('error', () => wrap.classList.add('failed'));
          wrap.insertBefore(img, wrap.querySelector('.logo-fallback'));
          img.src = profile.logo;
        }
      }
    } catch (err) {
      // Non-fatal: the static name, exchange and letter-tile logo remain in place.
      console.warn(`[${stock.symbol}] profile failed:`, err.message);
    }
  }

  async function loadQuote(stock) {
    const { root, refs } = cards.get(stock.symbol);

    let quote;
    try {
      quote = await api('/quote', { symbol: stock.symbol });
    } catch (err) {
      console.warn(`[${stock.symbol}] quote failed:`, err.message);
      refs.price.classList.remove('skeleton');
      setText(refs.price, '—');
      setText(refs.chip, 'Unavailable');
      return;
    }

    const current = Number(quote.c);
    const open = Number(quote.o) || Number(quote.pc);
    const prevClose = Number(quote.pc);
    const high = Number(quote.h);
    const low = Number(quote.l);

    if (!Number.isFinite(current) || current === 0) {
      refs.price.classList.remove('skeleton');
      setText(refs.price, '—');
      setText(refs.chip, 'No data');
      return;
    }

    // Requirement: arrow reflects the move since the market opened today.
    const trend = trendOf(current, open);
    const diff = current - open;
    const pct = open ? (diff / open) * 100 : 0;

    root.classList.remove('trend-up', 'trend-down', 'trend-flat');
    root.classList.add(`trend-${trend}`);

    refs.price.classList.remove('skeleton');
    setText(refs.price, `$${money(current)}`);
    refs.chip.innerHTML =
      `${signed(diff)} (${signed(pct)}%) <span class="vs">vs open</span>`;
    refs.arrow.innerHTML = ARROWS[trend];

    setText(refs.open, `$${money(open)}`);
    setText(refs.prev, `$${money(prevClose)}`);
    setText(refs.range,
      Number.isFinite(high) && Number.isFinite(low) && high > 0
        ? `$${money(low)} – $${money(high)}`
        : '—');

    root.classList.remove('errored');
  }

  async function loadConsensus(stock) {
    const { refs } = cards.get(stock.symbol);
    const container = refs.bars;

    let rows;
    try {
      rows = await api('/stock/recommendation', { symbol: stock.symbol });
    } catch (err) {
      console.warn(`[${stock.symbol}] recommendations failed:`, err.message);
      container.innerHTML = `<div class="placeholder">Consensus unavailable</div>`;
      return;
    }

    if (!Array.isArray(rows) || rows.length === 0) {
      container.innerHTML = `<div class="placeholder">No analyst coverage reported</div>`;
      return;
    }

    // Most recent reporting period first.
    const latest = rows
      .slice()
      .sort((a, b) => String(b.period).localeCompare(String(a.period)))[0];

    const strongBuy = Number(latest.strongBuy) || 0;
    const buy = Number(latest.buy) || 0;
    const hold = Number(latest.hold) || 0;
    const sell = Number(latest.sell) || 0;
    const strongSell = Number(latest.strongSell) || 0;

    const buyTotal = strongBuy + buy;
    const sellTotal = sell + strongSell;
    const total = buyTotal + hold + sellTotal;

    if (total === 0) {
      container.innerHTML = `<div class="placeholder">No analyst coverage reported</div>`;
      return;
    }

    const share = (n) => Math.round((n / total) * 1000) / 10;
    const segments = [
      { key: 'buy',  label: 'Buy',  count: buyTotal,  pct: share(buyTotal) },
      { key: 'hold', label: 'Hold', count: hold,      pct: share(hold) },
      { key: 'sell', label: 'Sell', count: sellTotal, pct: share(sellTotal) }
    ];

    // Stacked vertically: label | bar | percentage.
    container.innerHTML = segments.map((s) => `
      <div class="bar-row ${s.key}">
        <span class="bar-label">${s.label}</span>
        <div class="bar-track">
          <div class="bar-fill ${s.key}" data-width="${s.pct}"></div>
        </div>
        <span class="bar-pct">${s.pct}%</span>
      </div>
    `).join('');

    // Animate the bars in after paint.
    requestAnimationFrame(() => {
      container.querySelectorAll('.bar-fill').forEach((bar) => {
        bar.style.width = `${bar.dataset.width}%`;
      });
    });

    setText(refs.consensusNote,
      `${total} analysts · period ${latest.period} · ` +
      `${buyTotal} buy / ${hold} hold / ${sellTotal} sell`);
  }

  async function loadNews(stock) {
    const { refs } = cards.get(stock.symbol);
    const container = refs.news;

    const to = new Date();
    const from = new Date(to.getTime() - NEWS_DAYS * 86400000);
    const fmt = (d) => d.toISOString().slice(0, 10);

    let items;
    try {
      items = await api('/company-news', {
        symbol: stock.symbol,
        from: fmt(from),
        to: fmt(to)
      });
    } catch (err) {
      console.warn(`[${stock.symbol}] news failed:`, err.message);
      container.innerHTML = `<li class="placeholder">Headlines unavailable</li>`;
      return;
    }

    if (!Array.isArray(items) || items.length === 0) {
      container.innerHTML = `<li class="placeholder">No recent headlines</li>`;
      return;
    }

    const recent = items
      .filter((n) => n && n.headline && n.url)
      .sort((a, b) => (b.datetime || 0) - (a.datetime || 0))
      .slice(0, NEWS_COUNT);

    container.innerHTML = recent.map((n) => `
      <li class="news-item">
        <a href="${escapeHtml(n.url)}" target="_blank" rel="noopener noreferrer">
          ${n.image
            ? `<img class="news-thumb" src="${escapeHtml(n.image)}" alt="" loading="lazy" />`
            : ''}
          <div class="news-body">
            <p class="news-headline">${escapeHtml(n.headline)}</p>
            <span class="news-meta"><b>${escapeHtml(n.source || 'News')}</b> · ${timeAgo(n.datetime)}</span>
          </div>
        </a>
      </li>
    `).join('');

    // Hide thumbnails that fail to load so the text spans the full row.
    container.querySelectorAll('.news-thumb').forEach((img) => {
      img.addEventListener('error', () => { img.hidden = true; }, { once: true });
    });
  }

  /* ================================================================
     Status bar
  ================================================================ */
  const statusDot = $('#statusDot');
  const statusText = $('#statusText');

  function setStatus(state, text) {
    statusDot.className = 'dot' + (state === 'ok' ? '' : ` ${state}`);
    setText(statusText, text);
  }

  function stamp() {
    return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }

  /* ================================================================
     Orchestration
  ================================================================ */
  const refreshBtn = $('#refreshBtn');
  let quoteTimer = null;

  async function loadAll() {
    STOCKS.forEach(buildCard);

    const tasks = [];
    for (const stock of STOCKS) {
      tasks.push(() => loadProfile(stock));
      tasks.push(() => loadQuote(stock));
      tasks.push(() => loadConsensus(stock));
      tasks.push(() => loadNews(stock));
    }

    setStatus('loading', 'Loading market data…');
    await pool(tasks, (task) => task(), CONCURRENCY);

    const failed = STOCKS.filter((s) => {
      const el = cards.get(s.symbol);
      return el && el.refs.price.textContent.trim() === '—';
    });

    if (failed.length === STOCKS.length) {
      setStatus('error', 'Finnhub unreachable');
      showAlert();
    } else if (failed.length) {
      setStatus('loading', `Updated ${stamp()} · ${failed.length} symbol(s) failed`);
    } else {
      setStatus('ok', `Live · updated ${stamp()}`);
    }
  }

  async function refreshQuotes() {
    refreshBtn.classList.add('busy');
    refreshBtn.disabled = true;
    try {
      await pool(STOCKS, (stock) => loadQuote(stock), CONCURRENCY);
      const failed = STOCKS.some((s) => cards.get(s.symbol).refs.price.textContent.trim() === '—');
      setStatus(failed ? 'loading' : 'ok', `${failed ? 'Partial data' : 'Live'} · updated ${stamp()}`);
    } finally {
      refreshBtn.classList.remove('busy');
      refreshBtn.disabled = false;
    }
  }

  function showAlert(html) {
    if (document.querySelector('.alert')) return;
    const box = document.createElement('div');
    box.className = 'alert';
    box.innerHTML = html || (
      'Could not reach the Finnhub REST API. Check your internet connection and confirm the ' +
      'key in <code>.env</code> is active.'
    );
    document.querySelector('.masthead').after(box);
  }

  refreshBtn.addEventListener('click', () => {
    refreshQuotes();
    clearInterval(quoteTimer);
    quoteTimer = setInterval(refreshQuotes, AUTO_REFRESH_MS);
  });

  // Pause polling while the tab is hidden; resume immediately on return.
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      clearInterval(quoteTimer);
      quoteTimer = null;
    } else if (!quoteTimer) {
      refreshQuotes();
      quoteTimer = setInterval(refreshQuotes, AUTO_REFRESH_MS);
    }
  });

  /* ================================================================
     Boot
  ================================================================ */
  (async function boot() {
    setStatus('loading', 'Reading .env…');
    const apiKey = await resolveApiKey();

    if (!apiKey) {
      STOCKS.forEach(buildCard);
      renderKeyNotice();
      setStatus('error', 'API key missing');
      return;
    }

    // Finnhub keys are 20 chars. A longer composite key is used as-is, with
    // its 20-char prefix kept as a fallback in case it is ever rejected.
    KEYS = apiKey.length > 20 ? [apiKey, apiKey.slice(0, 20)] : [apiKey];

    await loadAll();
    quoteTimer = setInterval(refreshQuotes, AUTO_REFRESH_MS);
  })();

  function renderKeyNotice() {
    showAlert(
      'No Finnhub API key found. Create a file named <code>.env</code> next to ' +
      '<code>index.html</code> containing <code>FINNHUB_API_KEY=your_key_here</code>, then reload.<br><br>' +
      'The page must be served over <code>http://</code> (e.g. <code>python -m http.server 5500</code>). ' +
      'A page opened directly from <code>file://</code> cannot read <code>.env</code>.'
    );
  }
})();
</script>
</body>
</html>
